name: "Code Review Process Workflow"
type: "workflow"
version: "1.0.0"
description: "Complete PR creation, review, approval, and merge workflow"

category: "development"
tags: ["pr", "pull-request", "review", "merge", "collaboration", "code-quality", "github"]

status: "stable"
author: "Proto Gear Team"
last_updated: "2025-01-18"

dependencies:
  required:
    - "skills/code-review"
  optional:
    - "skills/testing"
    - "commands/update-status"
  suggested:
    - "workflows/feature-development"
    - "workflows/bug-fix"

conflicts: []

composable_with:
  - "skills/code-review"
  - "skills/testing"
  - "commands/update-status"
  - "commands/create-ticket"
  - "workflows/feature-development"
  - "workflows/bug-fix"
  - "workflows/hotfix"

agent_roles:
  - "Code Review Agent"
  - "Full-Stack Developer Agent"
  - "Backend Agent"
  - "Frontend Agent"
  - "Team Lead Agent"

relevance:
  triggers:
    - "code review"
    - "pull request"
    - "PR"
    - "merge"
    - "review"
    - "approve"
    - "create pr"
    - "open pr"
  contexts:
    - "After feature implementation is complete"
    - "Before merging to main/development"
    - "When requesting feedback on code"
    - "During collaborative development"

usage_notes: |
  Complete code review workflow from PR creation through merge.

  Flow: prepare -> create PR -> request review -> address feedback ->
        get approval -> merge -> post-merge cleanup

  Integrates with skills/code-review for review expertise.
  Use after completing feature/bug-fix work and before merging.

required_files:
  - "BRANCHING.md"

optional_files:
  - "PROJECT_STATUS.md"
  - "AGENTS.md"
  - "CONTRIBUTING.md"

workflow:
  steps: 7
  estimated_duration: "30 min - 4 hours (depends on review cycles)"
  outputs:
    - "type: merged-code"
    - "type: documentation"
  gates:
    # ADR-002 dogfood falsifier (action item 4, PROTO-073): the ONE engineering
    # gate migrated to the graded-authority model — declared here in metadata
    # alone, with zero core edits (if it had needed one, the primitive was
    # wrong). The code-review agent is the accountable actor: it verifies the
    # PR and recommends; a human ratifies before merge, and their name in the
    # "Reviewed by" cell records the residual-risk acceptance. Pure-human gates
    # elsewhere (release-approval, announcement-approval) stay `human`.
    - id: "pr-review-approval"
      description: "The code-review agent verifies the pull request and recommends; a human ratifies before merge, recording their sign-off in the Reviewed-by column."
      before: "merge"
      approver: "human"
      required: true
      actor: "code-review-agent"
      authority: "human-on-recommendation"
      # Per-change engineering gate: evidenced by the "Reviewed by" column on the
      # completed-tickets table in PROJECT_STATUS.md, so `pg trace`/`pg release`
      # can verify each ticket was reviewed. (Release-level engineering gates —
      # release-approval, announcement-approval — stay unverified per-ticket: a
      # single ticket doesn't clear a release gate.) Mapping form: the predicate
      # is the explicit non-empty claim — the human ratifier's name is present.
      evidence:
        column: "Reviewed by"
        predicate: "non-empty"
