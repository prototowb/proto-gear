name: "Publish Content"
type: "workflow"
version: "0.1.0"
description: "Take an approved content item live on its channel, after a human sign-off gate."

category: "content"
tags: ["content", "publish", "social", "approval"]

status: "beta"
author: "Content Module"
last_updated: "2026-07-10"

dependencies:
  required: []
  optional: []
  suggested: []

conflicts: []

composable_with: []

agent_roles:
  - "Content Agent"
  - "Editor Agent"

relevance:
  triggers:
    - "publish"
    - "go live"
    - "ship post"
    - "release content"
  contexts:
    - "When an item has cleared review and needs to go public"

usage_notes: |
  Moves a queue item from `review` to `scheduled`/`published`. The
  content-approval gate is mandatory: nothing goes public without a human
  editor recorded in the queue's "Approved by" column.

required_files:
  - "CONTENT_QUEUE.md"

workflow:
  steps: 4
  estimated_duration: "15-30 minutes"
  outputs:
    - "type: publish"
  gates:
    - id: "content-approval"
      description: "A human editor approves copy, brand fit, and legal before an item leaves review; nothing reaches scheduled/published without a name in the queue's Approved by column."
      before: "schedule"
      approver: "human"
      required: true
