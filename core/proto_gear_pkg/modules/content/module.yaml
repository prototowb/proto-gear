# Content department module — the SECOND implementation of the module contract
# (PROJECT_SPECIFICATIONS.md §3), shipped to falsify the contract: the
# department-agnostic core must discover, load, and audit it with ZERO edits to
# module_core/ (ADR-001 Phase B exit criterion, Phase C entry — action item 7).
#
# Unlike engineering, this module ships no engine code yet — it is a pure
# manifest + templates + design doc. That is deliberate: if a department whose
# only artifact is a manifest still loads and validates through the same
# interfaces as engineering, the contract is real and not engineering-shaped.

module: content
name: Content
description: >-
  Content / marketing department module — drafts, reviews, scheduling, and
  publishing encoded as agent-discoverable state, with human approval gated
  before anything goes public.
version: 0.1.0

# Contract surfaces (paths are relative to a host project's root, i.e. where the
# module is initialised). These mirror engineering's surfaces by *role*, not by
# filename — the state surface is a content queue, not a ticket board.
contract:
  capabilities_root: .proto-gear        # item 1 — skills / workflows / commands
  state_surface: CONTENT_QUEUE.md       # item 2 — draft→review→scheduled→published
  context_manifest: AGENT_CONTEXT.md    # item 3 — agent skim, mirrored to hosts
  handoff: SESSION_HANDOFF.md           # item 6 — rolling session handoff
