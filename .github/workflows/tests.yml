name: Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install lint tooling
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Pin black — its formatting changes between releases, so an unpinned
        # install made the matrix non-deterministic (3.8 jobs pulled black 24.x,
        # 3.11+ pulled 26.x, and they disagreed). Keep this pin in lock-step
        # with dev/hooks/pre-commit so local and CI agree.
        pip install flake8 black==26.5.1 mypy

    - name: Lint with flake8
      run: |
        # Hard gate: syntax errors / undefined names only.
        flake8 core/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Informational: style/complexity warnings never fail the build.
        flake8 core/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check core/ tests/

    - name: Type check with mypy (informational)
      run: |
        mypy core/ --ignore-missing-imports || true

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=core --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  coverage-check:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Check coverage threshold
      run: |
        pytest tests/ --cov=core --cov-fail-under=15
        echo "✅ Coverage is at least 15%"
