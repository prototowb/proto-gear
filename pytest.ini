[pytest]
# Pytest configuration for ProtoGear
#
# NOTE: this section MUST be [pytest] in a pytest.ini file — [tool:pytest] is the
# setup.cfg/tox.ini spelling and is silently ignored here (which historically
# disabled every option below). Coverage is intentionally opt-in rather than in
# addopts, so the pre-commit hook's plain `pytest` run stays fast; measure with:
#   pytest --cov=core/proto_gear_pkg --cov-report=term-missing

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    cli: marks tests that test CLI interface
    wizard: marks tests that test wizard functionality
    filegeneration: marks tests that generate actual files

# Coverage configuration (used when --cov is passed)
[coverage:run]
source = core
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
skip_covered = False
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestReturnNotNoneWarning